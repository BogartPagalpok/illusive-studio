        <h1>Ian Lester Eclevia — Digital Art Director &amp; Frontend Developer</h1>
        <p><strong>Illusive Studio</strong> (also known as <em>The Illusive Lab</em>) — Masinloc, Zambales, Philippines.</p>
        <p>Multi-disciplinary creative operator bridging premium aesthetic design, technical execution, and algorithmic strategy. End-to-end production pipeline: UX, code, footage, audio — zero hand-off friction.</p>
        <p><strong>Contact:</strong> <a href="mailto:yhanlhester@gmail.com">yhanlhester@gmail.com</a> · <strong>GitHub:</strong> <a href="https://github.com/BogartPagalpok">github.com/BogartPagalpok</a></p>

        <h2>About</h2>
        <p>I'm Ian Lester Eclevia — a graphic designer, photographer, frontend developer, and virtual assistant who believes that great design is where timeless elegance meets modern trends. With deep proficiency in React, Photoshop, digital painting, and photography, I craft visual stories that don't just look beautiful — they communicate, connect, and convert. Beyond design, I bring the same dedication to virtual assistance — organized, proactive, and committed to making operations run seamlessly.</p>

        <h2>Services</h2>

        <h3>Frontend Engineering</h3>
        <p>Production-grade web applications in React, Vite, TypeScript, and Tailwind CSS. Mobile-first, performance-tuned, Progressive Web App-ready.</p>

        <h3>UI / UX Design</h3>
        <p>Interface systems, design tokens, prototyping, and component libraries with a focus on conversion-oriented layouts.</p>

        <h3>Brand Identity</h3>
        <p>Logo systems, typography pairings, color systems, and brand guidelines for startups and creators.</p>

        <h3>Digital Art Direction</h3>
        <p>Advanced compositing in Adobe Photoshop, AI-augmented art direction using Midjourney workflows, and digital painting.</p>

        <h3>High-Retention Video Editing</h3>
        <p>Short-form vertical content engineered for TikTok, Reels, and YouTube Shorts algorithms. Live event Same-Day Edits (SDE). Commercial compositing.</p>

        <h3>Editorial Photography</h3>
        <p>Portrait, product, and editorial photography with full post-production pipeline.</p>

        <h3>Virtual Assistance</h3>
        <p>Organized creative-operations support, design pipeline management, and admin workflows.</p>

        <h2>Technical Stack</h2>
        <p>
          <span class="tag">React</span><span class="tag">TypeScript</span><span class="tag">Vite</span><span class="tag">Tailwind CSS</span><span class="tag">Framer Motion</span><span class="tag">GSAP</span><span class="tag">Three.js</span><span class="tag">Supabase</span><span class="tag">Vercel</span><span class="tag">Photoshop</span><span class="tag">Premiere Pro</span><span class="tag">Lightroom</span><span class="tag">Midjourney</span><span class="tag">Canva Pro</span>
        </p>

        <h2>Skills &amp; Proficiency</h2>
        <ul>
          <li>Frontend Development (React, Tailwind) — 90%</li>
          <li>Advanced Compositing (Photoshop) — 95%</li>
          <li>Motion Graphics &amp; VFX — 85%</li>
          <li>Editorial Photography — 92%</li>
          <li>UI/UX Prototyping — 88%</li>
          <li>Agile Pipelines (Canva Pro) — 95%</li>
          <li>Digital Illustration — 90%</li>
          <li>Typography &amp; Grid Systems — 87%</li>
        </ul>

        <h2>Selected Works</h2>
        <p>Portfolio includes projects across Graphic Design, UI/UX, Motion, and Photography categories. Featured: <strong>Modular Creative Testing</strong> — a growth marketing case study demonstrating modern Meta Ads testing strategy with visual hooks as targeting filters, mapping colorways to audience segments, post-click landing pages, and campaign performance metrics.</p>
        <p>For full interactive case studies, please view the site with JavaScript enabled.</p>

        <h2>Frequently Asked Questions</h2>

        <h3>What is your primary frontend development stack?</h3>
        <p>I primarily build web applications utilizing React, Vite, TypeScript, and Tailwind CSS, focusing on mobile-first, high-performance Progressive Web Apps (PWAs).</p>

        <h3>Do you offer professional video editing services?</h3>
        <p>Yes, I specialize in dynamic micro-narratives, live event Same-Day Edits (SDE), and high-retention short-form content engineered for modern social media algorithms.</p>

        <h3>Where are you based, and do you work with international clients?</h3>
        <p>I'm based in Masinloc, Zambales, Philippines, and work fully remote with clients worldwide.</p>

        <h3>How can I hire you?</h3>
        <p>Email <a href="mailto:yhanlhester@gmail.com">yhanlhester@gmail.com</a> directly, or use the contact form on the homepage.</p>
